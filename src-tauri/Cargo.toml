[package]
name = "omniterm"
version = "0.1.0"
description = "OmniTerm Pro - Modern Cross-Platform Terminal and Remote Client"
authors = ["SUNCLOUD"]
edition = "2021"

[[bin]]
name = "omniterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
portable-pty = "0.8"
dirs = "5.0"

